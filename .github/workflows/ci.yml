name: CI

# WHEN it runs: on every PR, and on every push to master (after a merge).
on:
  pull_request:
  push:
    branches: [ master ]
    
    
# Required permissions to write/push packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Settings shared by every step in this job.
    env:
      ConnectionStrings__SchoolPortalDb: Host=localhost;Port=5432;Database=schoolportal_test;Username=postgres;Password=postgres
      # Overrides Seed:Users:*:Email and :Password from appsettings / user-secrets.
      # WHY override: CI shouldn't depend on your real emails, and the tests
      # must know exactly which admin exists. These values are CI-only and die
      # with the throwaway DB. Passwords must satisfy your Identity rules.
      Seed__Users__Password: Ci-Passw0rd!2026
      Seed__Users__Admin__Email: ci-admin@example.com
      Seed__Users__Teacher__Email: ci-teacher@example.com
      Seed__Users__Student__Email: ci-student@example.com
      # Dummy value. The email module reads Email:AppPassword, and it may
      # refuse to start without something there. CI never sends real emails.
      Email__AppPassword: ci-not-a-real-password
      # Read by the integration tests to log in. These MUST equal the Admin
      # email and password above, because the tests log in as the seeded admin.
      TEST_ADMIN_EMAIL: ci-admin@example.com
      TEST_ADMIN_PASSWORD: Ci-Passw0rd!2026

    # GitHub starts this container beside the job, so tests have a real DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      # STEP 1: get the code.
      # WHY first: the machine starts EMPTY. Every later step needs your files, so nothing else can run before this.
      - name: Checkout
        uses: actions/checkout@v4
          
      # STEP 2: install the .NET SDK.
      # It must come AFTER checkout because it reads global.json from your repo.
      # WHY global-json-file: global.json is the single source of truth for the SDK version,
      # so CI uses the same SDK as your laptop. You change the version in ONE place.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # STEP 3: Restore downloads the NuGet packages your projects reference.
      - name: Restore
        run: dotnet restore
      
      # STEP 4: compiles your code into DLLs, which needs the SDK (step 2), the code (step 1) and the packages
      # -c Release: build the Release configuration, which is what you ship
      # --no-restore: step 3 already restored, so don't download again.
      - name: Build
        run: dotnet build --no-restore -c Release
        
      # STEP 5: create the tables
      # "dotnet ef" is not part of the SDK, so install it (match your EF Core major version, 10).
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      # The CI database is empty. This is the same command you run by handlocally, once per module. 
      # --no-build + --configuration Release reuse the build from the step above.
      - name: Apply migrations (one per module)
        run: |
          dotnet ef database update --no-build --configuration Release --project SchoolPortal.Identities.Infrastructure/SchoolPortal.Identities.Infrastructure.csproj --startup-project SchoolPortal.Web/SchoolPortal.Web.csproj --context IdentityDbContext
          dotnet ef database update --no-build --configuration Release --project SchoolPortal.Students.Infrastructure/SchoolPortal.Students.Infrastructure.csproj --startup-project SchoolPortal.Web/SchoolPortal.Web.csproj --context StudentsDbContext
          dotnet ef database update --no-build --configuration Release --project SchoolPortal.Grades.Infrastructure/SchoolPortal.Grades.Infrastructure.csproj --startup-project SchoolPortal.Web/SchoolPortal.Web.csproj --context GradesDbContext
          dotnet ef database update --no-build --configuration Release --project SchoolPortal.Attendances.Infrastructure/SchoolPortal.Attendances.Infrastructure.csproj --startup-project SchoolPortal.Web/SchoolPortal.Web.csproj --context AttendancesDbContext
          dotnet ef database update --no-build --configuration Release --project SchoolPortal.Notifications.Infrastructure/SchoolPortal.Notifications.Infrastructure.csproj --startup-project SchoolPortal.Web/SchoolPortal.Web.csproj --context NotificationsDbContext
  
      # STEP 6:
      # WHY: Program.cs stores Data Protection keys in /keys (a Docker volume in production).
      # On the CI runner that folder doesn't exist, and the runner user can't create folders in the filesystem root.
      # Data Protection is needed to issue the login cookie and CSRF tokens, so without this the
      # tests fail at the first cookie. Create the folder and give the runner user ownership of it.
      - name: Create Data Protection keys folder
        run: |
          sudo mkdir -p /keys
          sudo chown "$USER" /keys
      
      # STEP 7: run the tests (this includes Architechture and integrations).
      # --no-build: step 4 already compiled, so don't compile again.
      # -c Release: REQUIRED here too. --no-build only skips compiling, it still has to FIND the output, 
      # and without -c Release it looks in bin/Debug, finds nothing, and errors: can’t find the test DLL.
      # "dotnet test" runs every test project in the solution
      # --logger trx: also write the results to a .trx file, so I can upload it.
      # --results-directory: where those files go.
      # WHY no LogFileName: I now have TWO test projects (ArchTests and IntegrationTests).
      # A fixed file name would make the second overwrite the first.
      # Without it, each project gets its own unique file name.
      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger trx
          --results-directory ./TestResults
        
      # STEP 8: Upload test results in artifact
      # WHY "if: always()": the results matter MOST when tests fail, and a failed
      # step would normally skip everything after it.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
        
  # A second, separate job: does the Dockerfile still build?
  # WHY separate: it runs in parallel and gets its own check name, so I can tell
  # "tests failed" from "Dockerfile broken" at a glance.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      # The runner starts empty, so it needs my code (including the Dockerfile).
      - name: Checkout
        uses: actions/checkout@v4

      # WHY plain "docker build": it does the one job I need. Nothing is pushed
      # (no registry login, no secrets), and the image is thrown away with the runner.
      # "." = build from the repo root, where the Dockerfile lives.
      # Add caching only if builds become painfully slow.
      - name: Build image (no push)
        run: docker build -t schoolportal:ci .
        
  build-and-push:
    runs-on: ubuntu-latest
      
    # WHY this if: the workflow also runs on pull requests, and we only want to publish after a push.
    if: github.event_name == 'push'
    
    # Optional but recommended: don't publish an image unless the tests passed and the Dockerfile builds. 
    #    # Without it, all three jobs start at the same time.
    needs: [ build-and-test, docker-build ]
    
    steps:
      # Step 1: Check out the code from the master branch
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Log into the GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}                  # "My GitHub username"
          password: ${{ secrets.GITHUB_TOKEN }}          # "The temporary keycard GitHub gave me"
      
      # Step 3: Extract metadata (tags) including latest and short SHA
      - name: Extract Docker metadata
        id: meta 
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sara-elhefnawy/schoolportal
          tags: |
            type=sha,format=short
            type=raw,value=latest
      
      # Step 4: Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tags must be entirely lowercase, Uses tags from Step 3
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  # It tells the container host to get the new image instead of the old image the hist has
  deploy:
    runs-on: ubuntu-latest
    
    # WHY needs: deploy only after the image is published. If build-and-push
    # is skipped (on a PR), this job is skipped too.
    needs: build-and-push
    
    # WHY if: never run a deploy from a pull request.
    if: github.event_name == 'push'
    
    # WHY this line: it makes the job pause until a required reviewer
    # approves, and it unlocks the secrets stored in the "production" environment.
    # With it, the job pauses until a reviewer approves.
    environment: production
    
    steps:
      - name: Restart the container on SnapDeploy
        # WHY env: the token is only released after approval, and passing it
        # through env keeps it out of the command text.
        env:
          SNAPDEPLOY_API_KEY: ${{ secrets.SNAPDEPLOY_API_KEY }}
          # WHY vars (not secrets): a container ID is not sensitive.
          CONTAINER_ID: ${{ vars.SNAPDEPLOY_CONTAINER_ID }}
        run: |
          BASE="https://snapdeploy.dev/api/mobile/containers/${CONTAINER_ID}"
          
          # WHY try restart first: if the container is running, restart makes it come back up.
          # WHY --write-out: it prints the HTTP status code so the script can decide what to do next.
          # The reply body goes to response.json.
          STATUS=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${BASE}/restart" \
            -H "X-API-Key: ${SNAPDEPLOY_API_KEY}")
          
          # WHY this check: free containers sleep after 15 minutes idle, so at deploy time
          # the container is often stopped, and restart refuses to act on a stopped container.
          # Only this specific refusal should lead to "start". Any other error must still fail the job.
          if [ "$STATUS" = "409" ] && grep -q "CONTAINER_NOT_RUNNING" response.json; then
            echo "Container is stopped, starting it instead."
            STATUS=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
              -X POST "${BASE}/start" \
              -H "X-API-Key: ${SNAPDEPLOY_API_KEY}")
          fi
          
          # WHY fail unless the code starts with 2: --write-out hides curl's own error exit code,
          # so the script has to check the status itself.
          # The reply contains no secrets (SnapDeploy never returns values to API keys).
          cat response.json
          echo
          if [ "${STATUS:0:1}" != "2" ]; then
            echo "SnapDeploy replied with HTTP $STATUS"
            exit 1
          fi

      - name: Wait until the app is ready
        # WHY vars: the address is public, so a variable is enough.
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          # WHY ${BASE_URL%/}: removes a trailing slash, so I never build "//health".
          URL="${BASE_URL%/}/health/ready"

          # WHY a loop: a stopped container needs about a minute to wake up and
          # the app needs a few seconds to start, so the first tries will fail.
          for attempt in $(seq 1 20); do
            # WHY --max-time 15: one slow reply must not hang the whole job.
            # WHY "|| true": if curl can't connect at all, the script keeps trying
            # instead of stopping. The status then reads 000.
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 15 "$URL" || true)
            echo "Attempt $attempt: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "App is ready."
              exit 0
            fi
            sleep 10
          done

          # WHY exit 1: this makes the job (and the run) go red.
          echo "App did not return 200 from $URL in time."
          exit 1